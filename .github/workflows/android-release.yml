name: Goobrow Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          GOOBROW_KEYSTORE_BASE64: ${{ secrets.GOOBROW_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOBROW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/goobrow-upload.jks"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify release keystore
        env:
          GOOBROW_KEYSTORE_BASE64: ${{ secrets.GOOBROW_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOBROW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/goobrow-verify.jks"
          echo "=== KEYSTORE SIZE ==="
          wc -c "$RUNNER_TEMP/goobrow-verify.jks"
          echo "=== KEYSTORE SHA256 ==="
          sha256sum "$RUNNER_TEMP/goobrow-verify.jks"
          echo "=== KEYSTORE TEST ==="
          keytool -list -keystore "$RUNNER_TEMP/goobrow-verify.jks" -alias "${{ secrets.GOOBROW_KEY_ALIAS }}" -storepass "${{ secrets.GOOBROW_STORE_PASSWORD }}" >/dev/null
          echo "KEYSTORE VERIFICATION PASSED"

      - name: Build signed AAB
        env:
          GOOBROW_STORE_FILE: ${{ runner.temp }}/goobrow-upload.jks
          GOOBROW_STORE_PASSWORD: ${{ secrets.GOOBROW_STORE_PASSWORD }}
          GOOBROW_KEY_ALIAS: ${{ secrets.GOOBROW_KEY_ALIAS }}
          GOOBROW_KEY_PASSWORD: ${{ secrets.GOOBROW_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Goobrow-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
