name: Goobrow Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          GOOBROW_KEYSTORE_BASE64: ${{ secrets.GOOBROW_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOBROW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/goobrow-upload.jks"

      - name: Build signed AAB
        env:
          GOOBROW_STORE_FILE: ${{ runner.temp }}/goobrow-upload.jks
          GOOBROW_STORE_PASSWORD: ${{ secrets.GOOBROW_STORE_PASSWORD }}
          GOOBROW_KEY_ALIAS: ${{ secrets.GOOBROW_KEY_ALIAS }}
          GOOBROW_KEY_PASSWORD: ${{ secrets.GOOBROW_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Goobrow-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
