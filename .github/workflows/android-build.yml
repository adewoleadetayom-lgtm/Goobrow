name: Goobrow Android Diagnostic Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Goobrow
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check Java and Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          echo "===== JAVA ====="
          java -version
          echo
          echo "===== GRADLE ====="
          ./gradlew --version

      - name: Build Debug APK with full diagnostic log
        id: build
        working-directory: android
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "GOOBROW GRADLE DIAGNOSTIC BUILD"
          echo "=================================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "=================================================="
          echo "GRADLE EXIT CODE: $BUILD_STATUS"
          echo "=================================================="

          echo
          echo "===== LAST 200 LINES OF GRADLE LOG ====="
          tail -n 200 ../gradle-build.log

          exit $BUILD_STATUS

      - name: Show diagnostic summary
        if: always()
        working-directory: android
        run: |
          echo "=================================================="
          echo "GOOBROW DIAGNOSTIC SUMMARY"
          echo "=================================================="

          if [ -f ../gradle-build.log ]; then
            echo
            echo "===== FAILURE / ERROR LINES ====="
            grep -n -E \
              "FAILURE:|What went wrong:|Caused by:|error:|Error:|Could not|Unable to|Exception" \
              ../gradle-build.log | tail -n 100 || true

            echo
            echo "===== LAST 200 LINES ====="
            tail -n 200 ../gradle-build.log
          else
            echo "gradle-build.log was not created."
          fi

      - name: Upload complete Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Goobrow-Gradle-Diagnostic-Log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Goobrow-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
