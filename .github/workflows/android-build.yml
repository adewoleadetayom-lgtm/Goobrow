name: Goobrow Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Goobrow
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify native browser
        run: |
          set -e
          test -f android/app/src/main/java/com/goobrow/browser/MainActivity.java
          test -f android/app/src/main/java/com/goobrow/browser/GoobrowBrowserPlugin.java
          test -f android/app/src/main/java/com/goobrow/browser/GoobrowBrowserActivity.java
          grep -q "GoobrowBrowserPlugin" android/app/src/main/java/com/goobrow/browser/MainActivity.java
          grep -q "GoobrowBrowserActivity" android/app/src/main/AndroidManifest.xml
          grep -q "WebView" android/app/src/main/java/com/goobrow/browser/GoobrowBrowserActivity.java
          echo "Native browser verification: OK"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Goobrow-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
