<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Goobrow</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 font-family:Arial,sans-serif;
 background:#fff;
 color:#202124;
}

body.dark{
 background:#202124;
 color:#fff;
}

header{
 height:62px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 12px;
 border-bottom:1px solid #ddd;
 background:inherit;
 position:sticky;
 top:0;
 z-index:10;
}

.logo{
 font-size:24px;
 font-weight:bold;
 white-space:nowrap;
}

.g{
 color:#4285f4;
}

.o1{
 color:#ea4335;
}

.o2{
 color:#fbbc05;
}

.b{
 color:#4285f4;
}

.r{
 color:#34a853;
}

.o3{
 color:#ea4335;
}

.w{
 color:#4285f4;
}

.address{
 flex:1;
 height:44px;
 border:1px solid #ddd;
 border-radius:24px;
 display:flex;
 align-items:center;
 background:#f8f9fa;
}

.dark .address{
 background:#303134;
 border-color:#555;
}

.address input{
 flex:1;
 border:0;
 outline:0;
 background:transparent;
 color:inherit;
 font-size:15px;
 padding:0 14px;
 min-width:0;
}

.address button{
 border:0;
 background:transparent;
 color:inherit;
 font-size:18px;
 padding:0 13px;
}

.iconbtn{
 width:40px;
 height:40px;
 border:0;
 background:transparent;
 color:inherit;
 font-size:21px;
 border-radius:50%;
}

.iconbtn:active{
 background:#ddd;
}

#home{
 height:calc(100vh - 62px);
 overflow:auto;
 text-align:center;
 padding:65px 15px;
}

.biglogo{
 font-size:58px;
 font-weight:bold;
 margin-bottom:30px;
}

.search{
 max-width:650px;
 margin:auto;
 height:54px;
 border:1px solid #ddd;
 border-radius:28px;
 display:flex;
 align-items:center;
 box-shadow:0 1px 7px #0002;
}

.dark .search{
 background:#303134;
 border-color:#555;
}

.search input{
 flex:1;
 border:0;
 outline:0;
 background:transparent;
 color:inherit;
 font-size:17px;
 padding:0 18px;
}

.search button{
 border:0;
 background:transparent;
 color:inherit;
 font-size:20px;
 padding:0 18px;
}

.services{
 max-width:750px;
 margin:35px auto;
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
 gap:10px;
}

.service{
 padding:15px 8px;
 border:1px solid #ddd;
 border-radius:12px;
 background:#f8f9fa;
 color:inherit;
 font-size:14px;
}

.dark .service{
 background:#303134;
 border-color:#555;
}

#browser{
 position:fixed;
 inset:62px 0 0 0;
 background:#fff;
 z-index:20;
 display:none;
}

.dark #browser{
 background:#202124;
}

#browser iframe{
 width:100%;
 height:100%;
 border:0;
}

#message{
 padding:30px;
 text-align:center;
}

footer{
 margin-top:50px;
 opacity:.65;
}

@media(max-width:600px){
 .logo{font-size:19px}
 .biglogo{font-size:45px}
 header{gap:5px}
 .address{height:42px}
}
</style>

<style id="goobrow-real-browser">
/* ===== SIMPLE GOOGLE-STYLE GOOBROW BROWSER ===== */

#browserChrome{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#fff;
  color:#202124;
  font-family:Arial,Helvetica,sans-serif;
}

#browserChrome.dark{
  background:#202124;
  color:#e8eaed;
}

/* SIMPLE TAB ROW */

.gb-tabs{
  height:40px;
  display:flex;
  align-items:center;
  padding:4px 8px;
  gap:4px;
  background:#f8f9fa;
  overflow-x:auto;
  scrollbar-width:none;
}

.gb-tabs::-webkit-scrollbar{
  display:none;
}

.dark .gb-tabs{
  background:#292a2d;
}

.gb-tab{
  height:32px;
  min-width:120px;
  max-width:190px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 9px;
  border-radius:8px;
  background:transparent;
  color:#5f6368;
  cursor:pointer;
}

.gb-tab:hover{
  background:#e8eaed;
}

.gb-tab.active{
  background:#fff;
  color:#202124;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
}

.dark .gb-tab{
  color:#bdc1c6;
}

.dark .gb-tab:hover{
  background:#3c4043;
}

.dark .gb-tab.active{
  background:#202124;
  color:#e8eaed;
}

.gb-tab-title{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px;
}

.gb-tab-close{
  border:0;
  background:transparent;
  color:inherit;
  width:22px;
  height:22px;
  border-radius:50%;
  font-size:16px;
  cursor:pointer;
}

.gb-tab-close:hover{
  background:#dadce0;
}

.gb-newtab{
  border:0;
  background:transparent;
  color:#5f6368;
  font-size:22px;
  width:34px;
  height:32px;
  border-radius:50%;
  cursor:pointer;
}

.gb-newtab:hover{
  background:#e8eaed;
}

.dark .gb-newtab{
  color:#bdc1c6;
}

.dark .gb-newtab:hover{
  background:#3c4043;
}

/* SIMPLE GOOGLE-STYLE TOOLBAR */

.gb-toolbar{
  height:54px;
  display:flex;
  align-items:center;
  gap:3px;
  padding:5px 10px;
  background:#fff;
  border-bottom:1px solid #dadce0;
}

.dark .gb-toolbar{
  background:#202124;
  border-color:#3c4043;
}

.gb-tool{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#5f6368;
  font-size:20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.gb-tool:hover{
  background:#f1f3f4;
}

.dark .gb-tool{
  color:#bdc1c6;
}

.dark .gb-tool:hover{
  background:#3c4043;
}

/* GOOGLE-LIKE ADDRESS BAR */

.gb-address{
  flex:1;
  height:38px;
  display:flex;
  align-items:center;
  background:#f1f3f4;
  border-radius:20px;
  padding:0 7px 0 13px;
  border:1px solid transparent;
}

.gb-address:hover{
  background:#e8eaed;
}

.gb-address:focus-within{
  background:#fff;
  border-color:#dadce0;
  box-shadow:0 1px 4px rgba(60,64,67,.18);
}

.dark .gb-address{
  background:#303134;
}

.dark .gb-address:hover{
  background:#3c4043;
}

.dark .gb-address:focus-within{
  background:#303134;
  border-color:#5f6368;
}

.gb-address input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:#202124;
  font-size:14px;
  min-width:0;
  padding:0 8px;
}

.dark .gb-address input{
  color:#e8eaed;
}

.gb-address input::placeholder{
  color:#5f6368;
}

.dark .gb-address input::placeholder{
  color:#9aa0a6;
}

.gb-address .gb-tool{
  width:30px;
  height:30px;
  font-size:18px;
}

/* WEBSITE AREA */

.gb-content{
  position:absolute;
  top:94px;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
}

.dark .gb-content{
  background:#202124;
}

.gb-content iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

/* MOBILE */

@media(max-width:600px){

  .gb-tabs{
    height:38px;
    padding:3px 5px;
  }

  .gb-tab{
    min-width:105px;
    max-width:160px;
    height:31px;
  }

  .gb-toolbar{
    height:53px;
    padding:5px 4px;
  }

  .gb-tool{
    width:31px;
    height:31px;
    font-size:18px;
  }

  .gb-address{
    height:37px;
  }

  .gb-address input{
    font-size:13px;
  }

  .gb-content{
    top:91px;
  }
}
</style>>>
</head>

<div id="home" class="google-home">

  <div class="google-topbar">
    <div class="google-top-left">
      <a href="https://about.google/" target="_blank">About</a>
      <a href="https://store.google.com/" target="_blank">Store</a>

    <div class="google-top-right">
      <a href="https://mail.google.com/" target="_blank">Gmail</a>

  </div>

  <main class="google-main">

    <div class="google-wordmark" aria-label="Goobrow">
      <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">b</span><span class="green">r</span><span class="red">o</span><span class="blue">w</span>

        <span class="google-search-icon">⌕</span>

        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          autofocus
          placeholder="Search Google or type a URL"
          aria-label="Search Google"
          oninput="googleSuggestionUpdate()"
          onkeydown="if(event.key==='Escape')googleSuggestionHide()"
        >

        <button type="button" class="google-voice" onclick="googleVoiceSearch()" title="Voice Search">🎙</button>

        <button type="submit" class="google-submit" title="Search">⌕</button>

        <div id="googleSuggestions" class="google-suggestions"></div>
      </div>

      <div class="google-buttons">
        <button type="submit">Google Search</button>

      </div>
    </form>

    <div class="google-language">

      <a href="#" onclick="return false">English</a>
    </div>

    <!-- ===== GOOGLE-STYLE HOMEPAGE NEWS ===== -->

      <div class="goobrow-news-heading">
        <div>
          <h2>Latest News</h2>
          <p>Top stories from Google News</p>
        </div>
        <button type="button" onclick="loadGoobrowHomeNews(true)">
          Refresh
        </button>
      </div>

      <div id="goobrowNewsStatus" class="goobrow-news-status">
        Loading latest news...
      </div>

      <div id="goobrowNewsGrid" class="goobrow-news-grid"></div>
    </section>

  </main>

  <footer class="google-footer">

    <div class="google-country">
      Nigeria
    </div>

    <div class="google-footer-links">
      <div>
        <a href="https://ads.google.com/" target="_blank">Advertising</a>
        <a href="https://smallbusiness.withgoogle.com/" target="_blank">Business</a>
        <a href="https://www.google.com/search/howsearchworks/" target="_blank">How Search works</a>
      </div>

      <div>
        <a href="https://policies.google.com/privacy" target="_blank">Privacy</a>
        <a href="https://policies.google.com/terms" target="_blank">Terms</a>
        <a href="#" onclick="googleSettings();return false">Settings</a>
      </div>
    </div>

  </footer>

</div>

<style>

}

.google-wordmark .blue{color:#4285f4}
.google-wordmark .red{color:#ea4335}

.google-search-form{
  width:min(584px,92vw);
}

.google-search-box{
  height:48px;
  border:1px solid #dfe1e5;

  display:flex;
  align-items:center;
  padding:0 14px;
  position:relative;
  background:#fff;
}

.google-search-box:hover,
.google-search-box:focus-within{

.google-search-icon{

.google-voice,
.google-submit{

/* ============================================================
   GOOBROW GOOGLE-STYLE HOMEPAGE NEWS
   ============================================================ */

.goobrow-home-news{
  width:min(1100px,92%);
  margin:35px auto 50px;
  padding:24px 0 10px;
  border-top:1px solid #dadce0;
}

.goobrow-news-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.goobrow-news-heading h2{
  margin:0;
  font-size:24px;
  font-weight:500;
  color:#202124;
}

.goobrow-news-heading p{
  margin:5px 0 0;
  color:#5f6368;
  font-size:14px;
}

.goobrow-news-heading button{
  border:1px solid #dadce0;
  background:white;
  color:#1a73e8;
  border-radius:20px;
  padding:9px 17px;
  cursor:pointer;
  font-size:14px;
}

.goobrow-news-heading button:hover{
  background:#f8f9fa;
}

.goobrow-news-status{
  color:#5f6368;
  font-size:14px;
  margin:10px 0 18px;
}

.goobrow-news-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.goobrow-news-card{
  border:1px solid #dadce0;
  border-radius:14px;
  overflow:hidden;
  background:white;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease;
}

.goobrow-news-card:hover{
  transform:translateY(-2px);
  box-shadow:0 3px 12px rgba(60,64,67,.18);
}

.goobrow-news-image-wrap{
  width:100%;
  height:170px;
  background:#f1f3f4;
  overflow:hidden;
}

.goobrow-news-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.goobrow-news-body{
  padding:15px;
}

.goobrow-news-source{
  color:#5f6368;
  font-size:12px;
  margin-bottom:7px;
}

.goobrow-news-title{
  color:#202124;
  font-size:17px;
  line-height:1.35;
  font-weight:500;
  margin:0 0 9px;
}

.goobrow-news-description{
  color:#5f6368;
  font-size:13px;
  line-height:1.45;
}

.goobrow-news-video{
  position:relative;
}

.goobrow-news-video::after{
  content:"▶";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.goobrow-news-empty{
  grid-column:1/-1;
  padding:30px;
  text-align:center;
  color:#5f6368;
}

body.dark .goobrow-home-news{
  border-top-color:#3c4043;
}

body.dark .goobrow-news-title{
  color:#e8eaed;
}

body.dark .goobrow-news-heading p,
body.dark .goobrow-news-source,

function googleVoiceSearch(){
  const input=document.getElementById("searchInput");

    window.SpeechRecognition ||

  if(!SpeechRecognition){
    alert("Voice search is not supported by this browser.");
    return;
  }

  const recognition=new SpeechRecognition();

  recognition.lang="en-NG";
  recognition.interimResults=false;
  recognition.maxAlternatives=1;

  recognition.onerror=function(){

<script>
/* ===== GOOBROW TAB ENGINE ===== */

const GB_HOME = location.origin + "/?goobrow_home=1";

let gbTabs = [];
let gbActive = 0;

function gbNewTab(url = GB_HOME, title = "New Tab"){
  gbTabs.push({
    url:url,
    title:title,
    history:[url],
    historyIndex:0,
    bookmark:false
  });

  gbActive = gbTabs.length - 1;
  gbRenderTabs();
  gbLoadActive();
}

function gbCloseTab(index){
  if(gbTabs.length === 1){
    gbTabs[0].url = GB_HOME;
    gbTabs[0].title = "New Tab";
    gbTabs[0].history = [GB_HOME];
    gbTabs[0].historyIndex = 0;
    gbActive = 0;
    gbLoadActive();
    return;
  }

  gbTabs.splice(index,1);

  if(gbActive >= gbTabs.length)
    gbActive = gbTabs.length - 1;

  gbRenderTabs();
  gbLoadActive();
}

function gbSwitchTab(index){
  if(index < 0 || index >= gbTabs.length) return;
  gbActive = index;
  gbRenderTabs();
  gbLoadActive();
}

function gbRenderTabs(){
  const tabs=document.getElementById("gbTabs");

  tabs.innerHTML="";

  gbTabs.forEach((tab,index)=>{
    const el=document.createElement("div");
    el.className="gb-tab"+(index===gbActive?" active":"");

    el.innerHTML=
      '<span>🌐</span>'+
      '<span class="gb-tab-title"></span>'+
      '<button class="gb-tab-close" title="Close">×</button>';

    el.querySelector(".gb-tab-title").textContent=tab.title;

    el.onclick=()=>gbSwitchTab(index);

    el.querySelector(".gb-tab-close").onclick=(e)=>{
      e.stopPropagation();
      gbCloseTab(index);
    };

    tabs.appendChild(el);
  });

  const plus=document.createElement("button");
  plus.className="gb-newtab";
  plus.textContent="+";
  plus.title="New Tab";
  plus.onclick=()=>gbNewTab();

  tabs.appendChild(plus);
}

function gbLoadActive(){
  const tab=gbTabs[gbActive];
  if(!tab)return;

  const frame=document.getElementById("gbFrame");
  const address=document.getElementById("gbAddress");

  address.value=tab.url;

  if(frame.src !== tab.url)
    frame.src=tab.url;
}

function gbNormalize(value){
  value=value.trim();

  if(!value)return GB_HOME;

  if(/^https?:\/\//i.test(value))
    return value;

  if(value.includes(".") && !value.includes(" "))
    return "https://"+value;

  return "/results.html?q="+encodeURIComponent(value);
}

function gbNavigate(){
  const address=document.getElementById("gbAddress");
  const value=gbNormalize(address.value);

  const tab=gbTabs[gbActive];

  tab.url=value;
  tab.title=value===GB_HOME ? "New Tab" : value.replace(/^https?:\/\//i,"");

  tab.history=tab.history.slice(0,tab.historyIndex+1);
  tab.history.push(value);
  tab.historyIndex=tab.history.length-1;

  localStorage.setItem("goobrowBrowserLastPage",value);

  gbRenderTabs();
  gbLoadActive();
}

function gbBack(){
  const tab=gbTabs[gbActive];

  if(tab.historyIndex>0){
    tab.historyIndex--;
    tab.url=tab.history[tab.historyIndex];
    gbLoadActive();
  }
}

function gbForward(){
  const tab=gbTabs[gbActive];

  if(tab.historyIndex<tab.history.length-1){
    tab.historyIndex++;
    tab.url=tab.history[tab.historyIndex];
    gbLoadActive();
  }
}

function gbReload(){
  const frame=document.getElementById("gbFrame");
  try{
    frame.contentWindow.location.reload();
  }catch(e){
    frame.src=frame.src;
  }
}

function gbHome(){
  const tab=gbTabs[gbActive];

  tab.url=GB_HOME;
  tab.title="New Tab";
  tab.history.push(GB_HOME);
  tab.historyIndex=tab.history.length-1;

  gbRenderTabs();
  gbLoadActive();
}

function gbBookmark(){
  const tab=gbTabs[gbActive];

  tab.bookmark=!tab.bookmark;

  const bookmarks=
    JSON.parse(localStorage.getItem("goobrowBookmarks")||"[]");

  const existing=bookmarks.findIndex(x=>x.url===tab.url);

  if(tab.bookmark && existing===-1)
    bookmarks.push({url:tab.url,title:tab.title});

  if(!tab.bookmark && existing!==-1)
    bookmarks.splice(existing,1);

  localStorage.setItem(
    "goobrowBookmarks",
    JSON.stringify(bookmarks)
  );
}

function gbHistory(){
  const tab=gbTabs[gbActive];

  const history=
    JSON.parse(localStorage.getItem("goobrowHistory")||"[]");

  if(tab.url && !history.includes(tab.url))
    history.unshift(tab.url);

  localStorage.setItem(
    "goobrowHistory",
    JSON.stringify(history.slice(0,100))
  );

  alert(
    "Goobrow History\\n\\n"+
    history.slice(0,20).join("\\n")
  );
}

function gbToggleDark(){
  const browser=document.getElementById("browserChrome");

  browser.classList.toggle("dark");

  localStorage.setItem(
    "goobrowBrowserDark",
    browser.classList.contains("dark") ? "1" : "0"
  );
}

function gbOpenBrowser(url){
  const target = url || "https://www.google.com/";

  try {
    if (
      window.Capacitor &&
      window.Capacitor.Plugins &&
      window.Capacitor.Plugins.GoobrowBrowser &&
      typeof window.Capacitor.Plugins.GoobrowBrowser.openBrowser === "function"
    ) {
      window.Capacitor.Plugins.GoobrowBrowser.openBrowser({
        url: target
      });
      return;
    }
  } catch (e) {
    console.warn("Native Goobrow browser unavailable:", e);
  }

  const chrome = document.getElementById("browserChrome");

  if (!chrome) {
    window.location.href = target;
    return;
  }

  chrome.style.display = "block";

  if (
    typeof gbNewTab === "function" &&
    typeof gbNavigateTo === "function"
  ) {
    if (gbTabs.length === 0) {
      gbNewTab(target, "Goobrow");
    } else {
      gbNavigateTo(target);
    }
  } else {
    window.location.href = target;
  }
}

function gbNavigateTo(url){
  const tab=gbTabs[gbActive];

  tab.url=url;
  tab.title=url===GB_HOME ? "New Tab" : url.replace(/^https?:\/\//i,"");

  tab.history.push(url);
  tab.historyIndex=tab.history.length-1;

  gbRenderTabs();
  gbLoadActive();
}

/* Make the browser available from the existing Goobrow page. */
window.goobrowOpenBrowser=gbOpenBrowser;


/* Prevent nested browser chrome when the homepage is loaded inside gbFrame. */
if(new URLSearchParams(location.search).has("goobrow_home")){
  const chrome=document.getElementById("browserChrome");
  if(chrome) chrome.style.display="none";
}

(function(){
  const browser=document.getElementById("browserChrome");

  if(localStorage.getItem("goobrowBrowserDark")==="1")
    browser.classList.add("dark");

  /* First browser tab is ALWAYS Goobrow's own homepage. */
  gbNewTab(GB_HOME,"New Tab");
})();
</script>

<script>
/* ============================================================
   GOOBROW 2026 — LIVE HOMEPAGE NEWS
   ============================================================ */

async function loadGoobrowHomeNews(forceRefresh = false) {

  const status = document.getElementById("goobrowNewsStatus");
  const grid = document.getElementById("goobrowNewsGrid");

  if (!status || !grid) return;

  status.textContent = "Loading latest news...";
  grid.innerHTML = "";

  try {

    const response = await fetch(
      "/api/news?q=" +
      encodeURIComponent("latest Nigeria news") +
      (forceRefresh ? "&t=" + Date.now() : "")
    );

    if (!response.ok) {
      throw new Error("News request failed");
    }

    const data = await response.json();
    const stories = Array.isArray(data.results)
      ? data.results
      : [];

    if (!stories.length) {
      status.textContent =
        "Latest news is temporarily unavailable.";
      return;
    }

    status.textContent =
      "Latest Nigeria news";

    stories.forEach((story) => {

      const card = document.createElement("article");
      card.className = "goobrow-news-card";

      const image =
        story.image ||
        story.imageUrl ||
        story.thumbnail ||
        "";

      const title =
        story.title ||
        "Untitled news story";

      const source =
        story.publisher ||
        story.source ||
        "Google News";

      const description =
        story.description || "";

      const date =
        story.publishedAt || "";

      const safeUrl =
        story.url ||
        story.link ||
        "#";

      card.innerHTML = `
        <div class="goobrow-news-image-wrap">

          ${
            image
              ? `
                <img
                  class="goobrow-news-image"
                  src="${escapeGoobrowHtml(image)}"
                  alt=""
                  loading="lazy"
                  onerror="this.style.display='none'"
                >
              `
              : `
                <div
                  style="
                    width:100%;
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#5f6368;
                    font-size:34px;
                  "
                >
                  📰
                </div>
              `
          }

        </div>

        <div class="goobrow-news-body">

          <div class="goobrow-news-source">
            ${escapeGoobrowHtml(source)}
            ${
              date
                ? " • " + escapeGoobrowHtml(formatGoobrowDate(date))
                : ""
            }
          </div>

          <h3 class="goobrow-news-title">
            ${escapeGoobrowHtml(title)}
          </h3>

          ${
            description
              ? `
                <div class="goobrow-news-description">
                  ${escapeGoobrowHtml(
                    description
                      .replace(/\s+/g, " ")
                      .slice(0, 180)
                  )}
                </div>
              `
              : ""
          }

        </div>
      `;

      card.addEventListener("click", () => {

        if (
          safeUrl &&
          safeUrl !== "#"
        ) {

          if (
            window.Capacitor &&
            window.Capacitor.Plugins &&
            window.Capacitor.Plugins.GoobrowBrowser
          ) {

            window.Capacitor.Plugins.GoobrowBrowser
              .openBrowser({ url: safeUrl })
              .catch(() => {
                window.open(
                  safeUrl,
                  "_blank"
                );
              });

          } else {

            window.open(
              safeUrl,
              "_blank"
            );

          }

        }

      });

      grid.appendChild(card);

    });

  } catch (error) {

    console.error(
      "Goobrow homepage news error:",
      error
    );

    status.textContent =
      "Unable to load latest news. Tap Refresh to try again.";

  }

}


/* ---------- HTML ESCAPING ---------- */

function escapeGoobrowHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ---------- NEWS DATE ---------- */

function formatGoobrowDate(value) {

  try {

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return value;
    }

    return date.toLocaleDateString(
      "en-NG",
      {
        day: "numeric",
        month: "short",
        year: "numeric"
      }
    );

  } catch {

    return value;

  }

}


/* ============================================================
   GOOBROW ACADEMIC SEARCH
   ============================================================ */

if (
  typeof window.academicSearch !== "function"
) {

  window.academicSearch = function () {

    const input =
      document.querySelector(
        ".google-search-box input"
      );

    const query =
      input && input.value.trim()
        ? input.value.trim()
        : "";

    if (!query) {

      if (input) {
        input.focus();
      }

      return false;

    }

    const academicUrl =
      "https://scholar.google.com/scholar?q=" +
      encodeURIComponent(query);

    if (
      window.Capacitor &&
      window.Capacitor.Plugins &&
      window.Capacitor.Plugins.GoobrowBrowser
    ) {

      window.Capacitor.Plugins.GoobrowBrowser
        .openBrowser({
          url: academicUrl
        })
        .catch(() => {
          window.open(
            academicUrl,
            "_blank"
          );
        });

    } else {

      window.open(
        academicUrl,
        "_blank"
      );

    }

    return false;

  };

}


/* ============================================================
   AUTOMATIC NEWS LOAD
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    setTimeout(
      function () {
        loadGoobrowHomeNews(false);
      },
      250
    );

  }
);

</script>
