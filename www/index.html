<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goobrow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #202124;
      min-height: 100vh;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 20px;
      gap: 20px;
      font-size: 14px;
    }

    header a {
      color: #202124;
      text-decoration: none;
    }

    .menu {
      font-size: 24px;
      cursor: pointer;
    }

    main {
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin-top: -50px;
    }

    .logo {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -4px;
      margin-bottom: 30px;
    }

    .logo span:nth-child(1) { color: #4285f4; }
    .logo span:nth-child(2) { color: #ea4335; }
    .logo span:nth-child(3) { color: #fbbc05; }
    .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(5) { color: #34a853; }
    .logo span:nth-child(6) { color: #ea4335; }

    .search-box {
      width: min(600px, 95vw);
      height: 52px;
      border: 1px solid #dfe1e5;
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      box-shadow: 0 1px 6px rgba(32,33,36,.15);
    }

    .search-box:focus-within {
      box-shadow: 0 2px 8px rgba(32,33,36,.25);
    }

    .search-icon {
      font-size: 20px;
      margin-right: 12px;
      color: #777;
    }

    #suggestions {
      width: min(600px, 95vw);
      background: white;
      border: 1px solid #dfe1e5;
      border-top: none;
      border-radius: 0 0 12px 12px;
      display: none;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(32,33,36,.15);
    }

    .suggestion {
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .suggestion:hover {
      background: #f8f9fa;
    }

    #searchInput {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
      background: transparent;
    }

    .voice {
      font-size: 21px;
      cursor: pointer;
      margin-left: 10px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      border: 1px solid #f8f9fa;
      background: #f8f9fa;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0,0,0,.1);
    }

    footer {
      height: 60px;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #70757a;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .logo {
        font-size: 52px;
      }

      .search-box {
        height: 50px;
      }

      .buttons {
        flex-direction: column;
        width: 180px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="#">About</a>
  <a href="#">Images</a>
  <span class="menu">☰</span>
</header>

<main>
  <div class="logo">
    <span>G</span><span>o</span><span>o</span><span>b</span><span>r</span><span>o</span><span>w</span>
  </div>

  <div class="search-box">
    <span class="search-icon">⌕</span>

    <input
      id="searchInput"
      type="text"
      placeholder="Search with Goobrow"
      autocomplete="off"
    >

    <span class="voice" onclick="voiceSearch()">🎤</span>
  </div>

  <div id="suggestions"></div>

  <div class="buttons">
    <button onclick="searchWeb()">Goobrow Search</button>
    <button onclick="luckySearch()">I'm Feeling Lucky</button>
  </div>
</main>

<footer>
  © 2026 Goobrow
</footer>

<script>
  const input = document.getElementById("searchInput");
const suggestionsBox = document.getElementById("suggestions");

input.addEventListener("input", async function() {
  const query = input.value.trim();

  if (!query) {
    suggestionsBox.style.display = "none";
    suggestionsBox.innerHTML = "";
    return;
  }

  try {
    const response = await fetch(
      "http://localhost:3001/api/suggestions?q=" +
      encodeURIComponent(query)
    );

    if (!response.ok) {
      throw new Error("Suggestion request failed");
    }

    const data = await response.json();

    suggestionsBox.innerHTML = "";

    if (!data.suggestions.length) {
      suggestionsBox.style.display = "none";
      return;
    }

    data.suggestions.forEach(function(suggestion) {
      const item = document.createElement("div");

      item.className = "suggestion";
      item.textContent = suggestion;

      item.onclick = function() {
        input.value = suggestion;
        searchWeb();
      };

      suggestionsBox.appendChild(item);
    });

    suggestionsBox.style.display = "block";
  } catch (error) {
    suggestionsBox.style.display = "none";
  }
});

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      searchWeb();
    }
  });

  function searchWeb() {
    const query = input.value.trim();

    if (!query) {
      input.focus();
      return;
    }

    window.location.href =
      "results.html?q=" + encodeURIComponent(query);
  }

  function luckySearch() {
    const query = input.value.trim();

    if (!query) {
      input.focus();
      return;
    }

    window.location.href =
      "results.html?q=" + encodeURIComponent(query);
  }

  function voiceSearch() {
    if (!("webkitSpeechRecognition" in window)) {
      alert("Voice search is not supported on this device.");
      return;
    }

    const recognition = new webkitSpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.start();

    recognition.onresult = function(event) {
      input.value = event.results[0][0].transcript;
      searchWeb();
    };
  }
</script>

</body>
</html>
