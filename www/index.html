<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 font-family:Arial,sans-serif;
 background:#fff;
 color:#202124;
}

body.dark{
 background:#202124;
 color:#fff;
}

header{
 height:62px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 12px;
 border-bottom:1px solid #ddd;
 background:inherit;
 position:sticky;
 top:0;
 z-index:10;
}

.logo{
 font-size:24px;
 font-weight:bold;
 white-space:nowrap;
}

.g{
 color:#4285f4;
}

.o1{
 color:#ea4335;
}

.o2{
 color:#fbbc05;
}

.b{
 color:#4285f4;
}

.r{
 color:#34a853;
}

.o3{
 color:#ea4335;
}

.w{
 color:#4285f4;
}

.address{
 flex:1;
 height:44px;
 border:1px solid #ddd;
 border-radius:24px;
 display:flex;
 align-items:center;
 background:#f8f9fa;
}

.dark .address{
 background:#303134;
 border-color:#555;
}

.address input{
 flex:1;
 border:0;
 outline:0;
 background:transparent;
 color:inherit;
 font-size:15px;
 padding:0 14px;
 min-width:0;
}

.address button{
 border:0;
 background:transparent;
 color:inherit;
 font-size:18px;
 padding:0 13px;
}

.iconbtn{
 width:40px;
 height:40px;
 border:0;
 background:transparent;
 color:inherit;
 font-size:21px;
 border-radius:50%;
}

.iconbtn:active{
 background:#ddd;
}

#home{
 height:calc(100vh - 62px);
 overflow:auto;
 text-align:center;
 padding:65px 15px;
}

.biglogo{
 font-size:58px;
 font-weight:bold;
 margin-bottom:30px;
}

.search{
 max-width:650px;
 margin:auto;
 height:54px;
 border:1px solid #ddd;
 border-radius:28px;
 display:flex;
 align-items:center;
 box-shadow:0 1px 7px #0002;
}

.dark .search{
 background:#303134;
 border-color:#555;
}

.search input{
 flex:1;
 border:0;
 outline:0;
 background:transparent;
 color:inherit;
 font-size:17px;
 padding:0 18px;
}

.search button{
 border:0;
 background:transparent;
 color:inherit;
 font-size:20px;
 padding:0 18px;
}

.services{
 max-width:750px;
 margin:35px auto;
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
 gap:10px;
}

.service{
 padding:15px 8px;
 border:1px solid #ddd;
 border-radius:12px;
 background:#f8f9fa;
 color:inherit;
 font-size:14px;
}

.dark .service{
 background:#303134;
 border-color:#555;
}

#browser{
 position:fixed;
 inset:62px 0 0 0;
 background:#fff;
 z-index:20;
 display:none;
}

.dark #browser{
 background:#202124;
}

#browser iframe{
 width:100%;
 height:100%;
 border:0;
}

#message{
 padding:30px;
 text-align:center;
}

footer{
 margin-top:50px;
 opacity:.65;
}

@media(max-width:600px){
 .logo{font-size:19px}
 .biglogo{font-size:45px}
 header{gap:5px}
 .address{height:42px}
}
</style>

<style id="goobrow-real-browser">
/* ===== SIMPLE GOOGLE-STYLE GOOBROW BROWSER ===== */

#browserChrome{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#fff;
  color:#202124;
  font-family:Arial,Helvetica,sans-serif;
}

#browserChrome.dark{
  background:#202124;
  color:#e8eaed;
}

/* SIMPLE TAB ROW */

.gb-tabs{
  height:40px;
  display:flex;
  align-items:center;
  padding:4px 8px;
  gap:4px;
  background:#f8f9fa;
  overflow-x:auto;
  scrollbar-width:none;
}

.gb-tabs::-webkit-scrollbar{
  display:none;
}

.dark .gb-tabs{
  background:#292a2d;
}

.gb-tab{
  height:32px;
  min-width:120px;
  max-width:190px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 9px;
  border-radius:8px;
  background:transparent;
  color:#5f6368;
  cursor:pointer;
}

.gb-tab:hover{
  background:#e8eaed;
}

.gb-tab.active{
  background:#fff;
  color:#202124;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
}

.dark .gb-tab{
  color:#bdc1c6;
}

.dark .gb-tab:hover{
  background:#3c4043;
}

.dark .gb-tab.active{
  background:#202124;
  color:#e8eaed;
}

.gb-tab-title{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px;
}

.gb-tab-close{
  border:0;
  background:transparent;
  color:inherit;
  width:22px;
  height:22px;
  border-radius:50%;
  font-size:16px;
  cursor:pointer;
}

.gb-tab-close:hover{
  background:#dadce0;
}

.gb-newtab{
  border:0;
  background:transparent;
  color:#5f6368;
  font-size:22px;
  width:34px;
  height:32px;
  border-radius:50%;
  cursor:pointer;
}

.gb-newtab:hover{
  background:#e8eaed;
}

.dark .gb-newtab{
  color:#bdc1c6;
}

.dark .gb-newtab:hover{
  background:#3c4043;
}

/* SIMPLE GOOGLE-STYLE TOOLBAR */

.gb-toolbar{
  height:54px;
  display:flex;
  align-items:center;
  gap:3px;
  padding:5px 10px;
  background:#fff;
  border-bottom:1px solid #dadce0;
}

.dark .gb-toolbar{
  background:#202124;
  border-color:#3c4043;
}

.gb-tool{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#5f6368;
  font-size:20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.gb-tool:hover{
  background:#f1f3f4;
}

.dark .gb-tool{
  color:#bdc1c6;
}

.dark .gb-tool:hover{
  background:#3c4043;
}

/* GOOGLE-LIKE ADDRESS BAR */

.gb-address{
  flex:1;
  height:38px;
  display:flex;
  align-items:center;
  background:#f1f3f4;
  border-radius:20px;
  padding:0 7px 0 13px;
  border:1px solid transparent;
}

.gb-address:hover{
  background:#e8eaed;
}

.gb-address:focus-within{
  background:#fff;
  border-color:#dadce0;
  box-shadow:0 1px 4px rgba(60,64,67,.18);
}

.dark .gb-address{
  background:#303134;
}

.dark .gb-address:hover{
  background:#3c4043;
}

.dark .gb-address:focus-within{
  background:#303134;
  border-color:#5f6368;
}

.gb-address input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:#202124;
  font-size:14px;
  min-width:0;
  padding:0 8px;
}

.dark .gb-address input{
  color:#e8eaed;
}

.gb-address input::placeholder{
  color:#5f6368;
}

.dark .gb-address input::placeholder{
  color:#9aa0a6;
}

.gb-address .gb-tool{
  width:30px;
  height:30px;
  font-size:18px;
}

/* WEBSITE AREA */

.gb-content{
  position:absolute;
  top:94px;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
}

.dark .gb-content{
  background:#202124;
}

.gb-content iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

/* MOBILE */

@media(max-width:600px){

  .gb-tabs{
    height:38px;
    padding:3px 5px;
  }

  .gb-tab{
    min-width:105px;
    max-width:160px;
    height:31px;
  }

  .gb-toolbar{
    height:53px;
    padding:5px 4px;
  }

  .gb-tool{
    width:31px;
    height:31px;
    font-size:18px;
  }

  .gb-address{
    height:37px;
  }

  .gb-address input{
    font-size:13px;
  }

  .gb-content{
    top:91px;
  }
}
</style>>>

<script>
/* ===== GOOGLE SEARCH HOMEPAGE ===== */

function goobrowGoogleSearch(event){
  if(event) event.preventDefault();

  const input=document.getElementById("searchInput");
  const q=input.value.trim();

  if(!q) return false;

  googleSuggestionHide();

  const googleUrl="https://www.google.com/search?q="+encodeURIComponent(q);

  if(typeof gbOpenBrowser==="function"){
    gbOpenBrowser("https://www.google.com/search?q="+encodeURIComponent(q));
  }else{
    window.location.href=googleUrl;
  }

  return false;
}

function googleLucky(){
  const input=document.getElementById("searchInput");
  const q=input.value.trim();

  if(!q) return;

  const url="https://www.google.com/search?btnI=1&q="+encodeURIComponent(q);

  if(typeof gbOpenBrowser==="function"){
    gbOpenBrowser(url);
  }else{
    window.location.href=url;
  }
}

function academicSearch(){
  const input=document.getElementById("searchInput");
  const q=input.value.trim();

  if(!q){
    input.focus();
    return;
  }

  googleSuggestionHide();

  const url="/results.html?q="+encodeURIComponent(q)+"&mode=academic";

  if(typeof gbOpenBrowser==="function"){
    gbOpenBrowser(url);
  }else{
    window.location.href=url;
  }
}

function googleVoiceSearch(){
  const input=document.getElementById("searchInput");

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Voice search is not supported by this browser.");
    return;
  }

  const recognition=new SpeechRecognition();

  recognition.lang="en-NG";
  recognition.interimResults=false;
  recognition.maxAlternatives=1;

  recognition.onresult=function(event){
    const text=event.results[0][0].transcript;
    input.value=text;
    goobrowGoogleSearch();
  };

  recognition.onerror=function(){
    alert("Voice search could not be completed.");
  };

  recognition.start();
}

function googleSuggestionUpdate(){
  const input=document.getElementById("searchInput");
  const box=document.getElementById("googleSuggestions");
  const q=input.value.trim();

  if(!q){
    googleSuggestionHide();
    return;
  }

  const suggestions=[
    q+" news",
    q+" images",
    q+" videos",
    q+" wikipedia"
  ];

  box.innerHTML="";

  suggestions.forEach(function(item){
    const div=document.createElement("div");
    div.className="google-suggestion";
    div.textContent="⌕  "+item;

    div.onclick=function(){
      input.value=item;
      goobrowGoogleSearch();
    };

    box.appendChild(div);
  });

  box.style.display="block";
}

function googleSuggestionHide(){
  const box=document.getElementById("googleSuggestions");
  if(box) box.style.display="none";
}

function googleAppsMenu(){
  if(typeof gbOpenBrowser==="function"){
    gbOpenBrowser("https://www.google.com/");
  }
}

function googleSettings(){
  alert(
    "Goobrow Browser Settings\n\n"+
    "Use the browser menu for browser settings, "+
    "dark mode, history and bookmarks."
  );
}

document.addEventListener("click",function(event){
  const box=document.getElementById("googleSuggestions");
  const search=document.querySelector(".google-search-box");

  if(box && search && !search.contains(event.target)){
    googleSuggestionHide();
  }
});
</script>

<script>
/* ===== GOOBROW TAB ENGINE ===== */

const GB_HOME = location.origin + "/?goobrow_home=1";

let gbTabs = [];
let gbActive = 0;

function gbNewTab(url = GB_HOME, title = "New Tab"){
  gbTabs.push({
    url:url,
    title:title,
    history:[url],
    historyIndex:0,
    bookmark:false
  });

  gbActive = gbTabs.length - 1;
  gbRenderTabs();
  gbLoadActive();
}

function gbCloseTab(index){
  if(gbTabs.length === 1){
    gbTabs[0].url = GB_HOME;
    gbTabs[0].title = "New Tab";
    gbTabs[0].history = [GB_HOME];
    gbTabs[0].historyIndex = 0;
    gbActive = 0;
    gbLoadActive();
    return;
  }

  gbTabs.splice(index,1);

  if(gbActive >= gbTabs.length)
    gbActive = gbTabs.length - 1;

  gbRenderTabs();
  gbLoadActive();
}

function gbSwitchTab(index){
  if(index < 0 || index >= gbTabs.length) return;
  gbActive = index;
  gbRenderTabs();
  gbLoadActive();
}

function gbRenderTabs(){
  const tabs=document.getElementById("gbTabs");

  tabs.innerHTML="";

  gbTabs.forEach((tab,index)=>{
    const el=document.createElement("div");
    el.className="gb-tab"+(index===gbActive?" active":"");

    el.innerHTML=
      '<span>🌐</span>'+
      '<span class="gb-tab-title"></span>'+
      '<button class="gb-tab-close" title="Close">×</button>';

    el.querySelector(".gb-tab-title").textContent=tab.title;

    el.onclick=()=>gbSwitchTab(index);

    el.querySelector(".gb-tab-close").onclick=(e)=>{
      e.stopPropagation();
      gbCloseTab(index);
    };

    tabs.appendChild(el);
  });

  const plus=document.createElement("button");
  plus.className="gb-newtab";
  plus.textContent="+";
  plus.title="New Tab";
  plus.onclick=()=>gbNewTab();

  tabs.appendChild(plus);
}

function gbLoadActive(){
  const tab=gbTabs[gbActive];
  if(!tab)return;

  const frame=document.getElementById("gbFrame");
  const address=document.getElementById("gbAddress");

  address.value=tab.url;

  if(frame.src !== tab.url)
    frame.src=tab.url;
}

function gbNormalize(value){
  value=value.trim();

  if(!value)return GB_HOME;

  if(/^https?:\/\//i.test(value))
    return value;

  if(value.includes(".") && !value.includes(" "))
    return "https://"+value;

  return "/results.html?q="+encodeURIComponent(value);
}

function gbNavigate(){
  const address=document.getElementById("gbAddress");
  const value=gbNormalize(address.value);

  const tab=gbTabs[gbActive];

  tab.url=value;
  tab.title=value===GB_HOME ? "New Tab" : value.replace(/^https?:\/\//i,"");

  tab.history=tab.history.slice(0,tab.historyIndex+1);
  tab.history.push(value);
  tab.historyIndex=tab.history.length-1;

  localStorage.setItem("goobrowBrowserLastPage",value);

  gbRenderTabs();
  gbLoadActive();
}

function gbBack(){
  const tab=gbTabs[gbActive];

  if(tab.historyIndex>0){
    tab.historyIndex--;
    tab.url=tab.history[tab.historyIndex];
    gbLoadActive();
  }
}

function gbForward(){
  const tab=gbTabs[gbActive];

  if(tab.historyIndex<tab.history.length-1){
    tab.historyIndex++;
    tab.url=tab.history[tab.historyIndex];
    gbLoadActive();
  }
}

function gbReload(){
  const frame=document.getElementById("gbFrame");
  try{
    frame.contentWindow.location.reload();
  }catch(e){
    frame.src=frame.src;
  }
}

function gbHome(){
  const tab=gbTabs[gbActive];

  tab.url=GB_HOME;
  tab.title="New Tab";
  tab.history.push(GB_HOME);
  tab.historyIndex=tab.history.length-1;

  gbRenderTabs();
  gbLoadActive();
}

function gbBookmark(){
  const tab=gbTabs[gbActive];

  tab.bookmark=!tab.bookmark;

  const bookmarks=
    JSON.parse(localStorage.getItem("goobrowBookmarks")||"[]");

  const existing=bookmarks.findIndex(x=>x.url===tab.url);

  if(tab.bookmark && existing===-1)
    bookmarks.push({url:tab.url,title:tab.title});

  if(!tab.bookmark && existing!==-1)
    bookmarks.splice(existing,1);

  localStorage.setItem(
    "goobrowBookmarks",
    JSON.stringify(bookmarks)
  );
}

function gbHistory(){
  const tab=gbTabs[gbActive];

  const history=
    JSON.parse(localStorage.getItem("goobrowHistory")||"[]");

  if(tab.url && !history.includes(tab.url))
    history.unshift(tab.url);

  localStorage.setItem(
    "goobrowHistory",
    JSON.stringify(history.slice(0,100))
  );

  alert(
    "Goobrow History\\n\\n"+
    history.slice(0,20).join("\\n")
  );
}

function gbToggleDark(){
  const browser=document.getElementById("browserChrome");

  browser.classList.toggle("dark");

  localStorage.setItem(
    "goobrowBrowserDark",
    browser.classList.contains("dark") ? "1" : "0"
  );
}

function gbOpenBrowser(url){
  const target = url || "https://www.google.com/";

  try {
    if (
      window.Capacitor &&
      window.Capacitor.Plugins &&
      window.Capacitor.Plugins.GoobrowBrowser &&
      typeof window.Capacitor.Plugins.GoobrowBrowser.openBrowser === "function"
    ) {
      window.Capacitor.Plugins.GoobrowBrowser.openBrowser({
        url: target
      });
      return;
    }
  } catch (e) {
    console.warn("Native Goobrow browser unavailable:", e);
  }

  const chrome = document.getElementById("browserChrome");

  if (!chrome) {
    window.location.href = target;
    return;
  }

  chrome.style.display = "block";

  if (
    typeof gbNewTab === "function" &&
    typeof gbNavigateTo === "function"
  ) {
    if (gbTabs.length === 0) {
      gbNewTab(target, "Goobrow");
    } else {
      gbNavigateTo(target);
    }
  } else {
    window.location.href = target;
  }
}

function gbNavigateTo(url){
  const tab=gbTabs[gbActive];

  tab.url=url;
  tab.title=url===GB_HOME ? "New Tab" : url.replace(/^https?:\/\//i,"");

  tab.history.push(url);
  tab.historyIndex=tab.history.length-1;

  gbRenderTabs();
  gbLoadActive();
}

</script>

<script>
/* ============================================================
   GOOBROW 2026 — LIVE HOMEPAGE NEWS
   ============================================================ */

async function loadGoobrowHomeNews(forceRefresh = false) {
  const status = document.getElementById("goobrowNewsStatus");
  const grid = document.getElementById("goobrowNewsGrid");

  if (!status || !grid) return;

  status.textContent = "Loading latest news...";
  grid.innerHTML = "";

  try {
    const goobrowNewsApiBase =
      (window.Capacitor &&
       window.Capacitor.isNativePlatform &&
       window.Capacitor.isNativePlatform())
        ? "https://goobrow.onrender.com"
        : "";

    const url =
      goobrowNewsApiBase +
      "/api/news?q=" +
      encodeURIComponent("latest Nigeria news") +
      (forceRefresh ? "&t=" + Date.now() : "");

    const response = await fetch(url, {
      method: "GET",
      cache: "no-store",
      headers: {
        "Accept": "application/json"
      }
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    const stories = Array.isArray(data.results)
      ? data.results
      : [];

    if (!stories.length) {
      status.textContent = "Latest news is temporarily unavailable.";
      return;
    }

    status.textContent = "Latest Nigeria news";

    stories.forEach(function(story) {
      const card = document.createElement("article");
      card.className = "goobrow-news-card";

      const title =
        story.title ||
        "News";

      const source =
        story.publisher ||
        story.source ||
        "Google News";

      const date =
        story.publishedAt ||
        "";

      const description =
        story.description ||
        "";

      const image =
        story.image ||
        story.imageUrl ||
        story.thumbnail ||
        "";

      const articleUrl =
        story.url ||
        story.link ||
        "";

      /* IMAGE */
      const imageWrap = document.createElement("div");
      imageWrap.className = "goobrow-news-image-wrap";

      if (image) {
        const img = document.createElement("img");

        img.className = "goobrow-news-image";
        img.src = image;
        img.alt = title;
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";

        img.onerror = function() {
          this.onerror = null;
          this.style.display = "none";

          const fallback = document.createElement("div");
          fallback.className = "news-image-fallback";
          fallback.textContent = "📰";

          imageWrap.appendChild(fallback);
        };

        imageWrap.appendChild(img);
      } else {
        const fallback = document.createElement("div");
        fallback.className = "news-image-fallback";
        fallback.textContent = "📰";
        imageWrap.appendChild(fallback);
      }

      /* BODY */
      const body = document.createElement("div");
      body.className = "goobrow-news-body";

      const sourceEl = document.createElement("div");
      sourceEl.className = "goobrow-news-source";

      sourceEl.textContent =
        source +
        (date ? " • " + formatGoobrowDate(date) : "");

      const titleEl = document.createElement("h3");
      titleEl.className = "goobrow-news-title";
      titleEl.textContent = title;

      body.appendChild(sourceEl);
      body.appendChild(titleEl);

      if (description) {
        const descriptionEl = document.createElement("div");
        descriptionEl.className = "goobrow-news-description";

        descriptionEl.textContent =
          description
            .replace(/\s+/g, " ")
            .slice(0, 180);

        body.appendChild(descriptionEl);
      }

      card.appendChild(imageWrap);
      card.appendChild(body);

      /* OPEN NEWS ARTICLE */
      card.addEventListener("click", function() {
        if (!articleUrl) return;

        if (
          window.Capacitor &&
          window.Capacitor.Plugins &&
          window.Capacitor.Plugins.GoobrowBrowser
        ) {
          window.Capacitor.Plugins.GoobrowBrowser
            .openBrowser({ url: articleUrl })
            .catch(function() {
              window.open(articleUrl, "_blank");
            });
        } else {
          window.open(articleUrl, "_blank");
        }
      });

      grid.appendChild(card);
    });

  } catch (error) {
    console.error("Goobrow homepage news error:", error);

    status.textContent =
      "Unable to load latest news. Tap Refresh to try again.";
  }
}


/* ---------- HTML ESCAPING ---------- */

function escapeGoobrowHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ---------- NEWS DATE ---------- */

function formatGoobrowDate(value) {

  try {

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return value;
    }

    return date.toLocaleDateString(
      "en-NG",
      {
        day: "numeric",
        month: "short",
        year: "numeric"
      }
    );

  } catch {

    return value;

  }

}


/* ============================================================
   GOOBROW ACADEMIC SEARCH
   ============================================================ */

if (
  typeof window.academicSearch !== "function"
) {

  window.academicSearch = function () {

    const input =
      document.querySelector(
        ".google-search-box input"
      );

    const query =
      input && input.value.trim()
        ? input.value.trim()
        : "";

    if (!query) {

      if (input) {
        input.focus();
      }

      return false;

    }

    const academicUrl =
      "https://scholar.google.com/scholar?q=" +
      encodeURIComponent(query);

    if (
      window.Capacitor &&
      window.Capacitor.Plugins &&
      window.Capacitor.Plugins.GoobrowBrowser
    ) {

      window.Capacitor.Plugins.GoobrowBrowser
        .openBrowser({
          url: academicUrl
        })
        .catch(() => {
          window.open(
            academicUrl,
            "_blank"
          );
        });

    } else {

      window.open(
        academicUrl,
        "_blank"
      );

    }

    return false;

  };

}


/* ============================================================
   AUTOMATIC NEWS LOAD
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    setTimeout(
      function () {
        loadGoobrowHomeNews(false);
      },
      250
    );

  }
);

</script>

      text==="Dernières actualités" ||
      text==="Últimas noticias" ||
      text==="Últimas notícias" ||
      text==="آخر الأخبار" ||
      text==="नवीनतम समाचार" ||
      text==="最新新闻" ||
      text==="最新ニュース" ||
      text==="최신 뉴스" ||
      text==="Àwọn Ìròyìn Tó Kẹ́yìn"
    ){
      el.textContent=t.latest;
    }

    if(
      text==="Top stories from Google News" ||
      text==="Actualités principales de Google News" ||
      text==="Principales noticias de Google News" ||
      text==="Principais notícias do Google News" ||
      text==="أهم الأخبار من أخبار Google" ||
      text==="Google समाचार की प्रमुख खबरें" ||
      text==="Google 新闻头条" ||
      text==="Google ニュースのトップストーリー" ||
      text==="Google 뉴스 주요 뉴스"
    ){
      el.textContent=t.newsTitle;
    }

    if(
      text==="Goobrow offered in:" ||
      text==="Goobrow proposé en :" ||
      text==="Goobrow disponible en:" ||
      text==="Goobrow متاح باللغة:" ||
      text==="Goobrow इन भाषाओं में उपलब्ध है:" ||
      text==="Goobrow 提供以下语言：" ||
      text==="Goobrow の対応言語：" ||
      text==="Goobrow 제공 언어:" ||
      text==="Goobrow wà ní àwọn èdè wọ̀nyí:"
    ){
      el.textContent=t.offered;
    }

  });

  /* Search boxes */
  document.querySelectorAll(
    'input[type="search"],input[name="q"],input[placeholder]'
  ).forEach(function(input){
    if(input.placeholder){
      input.placeholder=t.searchPlaceholder;
    }
  });

  /* Refresh buttons */
  document.querySelectorAll("button").forEach(function(btn){
    const text=(btn.textContent || "").trim();

    if(
      text==="Refresh" ||
      text==="Actualiser" ||
      text==="Actualizar" ||
      text==="Atualizar" ||
      text==="تحديث" ||
      text==="रिफ्रेश" ||
      text==="刷新" ||
      text==="更新" ||
      text==="새로고침" ||
      text==="Tún ṣe"
    ){
      btn.textContent=t.refresh;
    }
  });

  /* Mark selected language */
  document.querySelectorAll(
    "#goobrowLanguageSelector button[data-lang]"
  ).forEach(function(btn){
    btn.classList.toggle(
      "active",
      btn.dataset.lang===lang
    );
  });

  /* RTL support for Arabic */
  if(lang==="ar"){
    document.documentElement.dir="rtl";
  }else{
    document.documentElement.dir="ltr";
  }

  console.log("Goobrow language:",lang);
}

window.goobrowApplyLanguage=goobrowApplyLanguage;
window.goobrowTranslations=goobrowTranslations;

function goobrowInitRealLanguage(){

  let lang="en";

  try{
    lang=localStorage.getItem("goobrowLanguage") || "en";
  }catch(e){}

  if(!goobrowTranslations[lang]) lang="en";

  document.querySelectorAll(
    "#goobrowLanguageSelector button[data-lang]"
  ).forEach(function(btn){

    btn.addEventListener("click",function(){
      goobrowApplyLanguage(btn.dataset.lang);
    });

  });

  goobrowApplyLanguage(lang);
}

if(document.readyState==="loading"){
  document.addEventListener(
    "DOMContentLoaded",
    goobrowInitRealLanguage
  );
}else{
  goobrowInitRealLanguage();
}

})();
</script>

</html>
