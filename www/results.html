<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goobrow Search Results</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#202124;background:#fff}
.top{padding:16px 22px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:5}
.row{display:flex;align-items:center;gap:18px}.menu{font-size:27px;border:0;background:none;cursor:pointer}
.logo{font-size:31px;font-weight:700;letter-spacing:-2px;text-decoration:none}
.logo span:nth-child(1){color:#4285f4}.logo span:nth-child(2){color:#ea4335}.logo span:nth-child(3){color:#fbbc05}.logo span:nth-child(4){color:#4285f4}.logo span:nth-child(5){color:#34a853}.logo span:nth-child(6){color:#ea4335}.logo span:nth-child(7){color:#4285f4}
.search{width:min(700px,100%);height:46px;border:1px solid #dfe1e5;border-radius:24px;display:flex;align-items:center;padding:0 15px}.search input{flex:1;border:0;outline:0;font-size:16px}.search button{border:0;background:none;font-size:19px;cursor:pointer}
.side{position:fixed;top:0;left:-290px;width:280px;height:100%;background:#fff;box-shadow:4px 0 20px #0002;z-index:20;padding:20px;transition:.25s}.side.open{left:0}.side a{display:block;padding:14px;border-radius:10px;text-decoration:none;color:#333}.side a:hover{background:#f1f3f4}.close{float:right;border:0;background:none;font-size:24px}
.overlay{display:none;position:fixed;inset:0;background:#0005;z-index:10}.overlay.show{display:block}
.results{width:min(720px,92%);margin:28px 0 70px 7%}.result{margin-bottom:27px}.result h2{font-size:20px;font-weight:500;margin:0 0 5px}.result h2 a{color:#1a0dab;text-decoration:none}.result h2 a:hover{text-decoration:underline}.url{font-size:14px;color:#188038;margin-bottom:5px;word-break:break-all}.description{color:#4d5156;line-height:1.5}
.info{color:#70757a;font-size:14px;margin-bottom:20px}.pagination{display:flex;align-items:center;gap:14px;margin-top:35px}.pagination button{padding:10px 17px;border:1px solid #dadce0;border-radius:7px;background:#fff;cursor:pointer}.pagination button:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:600px){.results{margin-left:5%;width:90%}.result h2{font-size:18px}}
</style>

<style>
.images img{transition:.2s}
.images img:hover{transform:scale(1.03)}
@media(max-width:700px){
 .images{grid-template-columns:repeat(2,1fr)!important}
}
</style>
</head>
<body>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>
<aside id="side" class="side">
<button class="close" onclick="closeMenu()">×</button>
<h2>Goobrow Menu</h2>
<a href="index.html">🏠 Home</a>
<a href="index.html#news">📰 News</a>
<a href="results.html">🔎 Search</a>
<a href="extensions.html">🧩 Extensions</a>
<a href="https://images.google.com" target="_blank">🖼️ Images</a>
</aside>

<header class="top">
<div class="row">
<button class="menu" onclick="openMenu()">☰</button>
<a href="index.html" class="logo"><span>G</span><span>o</span><span>o</span><span>b</span><span>r</span><span>o</span><span>w</span></a>
<form class="search" onsubmit="search(event)">
<input id="searchInput" placeholder="Search with Goobrow">
<button>🔎</button>
</form>
</div>
</header>

<main class="results">
<div id="info" class="info">Searching Goobrow...</div>
<div id="results"></div>
<div id="pagination" class="pagination"></div>
</main>

<script>
const input=document.getElementById("searchInput");
const box=document.getElementById("results");
const info=document.getElementById("info");
const pagination=document.getElementById("pagination");
const params=new URLSearchParams(location.search);
const query=params.get("q")||"";
let page=Math.max(1,parseInt(params.get("page")||"1",10)||1);

input.value=query;

function esc(t){
const d=document.createElement("div");
d.textContent=t||"";
return d.innerHTML;
}

function openMenu(){document.getElementById("side").classList.add("open");document.getElementById("overlay").classList.add("show")}
function closeMenu(){document.getElementById("side").classList.remove("open");document.getElementById("overlay").classList.remove("show")}

function search(e){
if(e)e.preventDefault();
const q=input.value.trim();
if(q)location.href="results.html?q="+encodeURIComponent(q);
}

async function loadResults(){
if(!query){
info.textContent="Please enter a search query.";
return;
}
try{
const r=await fetch("/api/search?q="+encodeURIComponent(query)+"&page="+page);
if(!r.ok)throw new Error();
const data=await r.json();
info.textContent=data.totalResults+" results found for \""+query+"\"";
box.innerHTML="";

if(!data.results||!data.results.length){
box.innerHTML="<p>No results found for <b>"+esc(query)+"</b>.</p>";
return;
}

data.results.forEach(result=>{
const item=document.createElement("div");
item.className="result";
item.innerHTML=
`<h2><a href="${esc(result.url)}" target="_blank" rel="noopener">${esc(result.title)}</a></h2>
<div class="url">${esc(result.url)}</div>
<div class="description">${esc(result.description)}</div>`;
box.appendChild(item);
});

pagination.innerHTML="";
const prev=document.createElement("button");
prev.textContent="Previous";
prev.disabled=page<=1;
prev.onclick=()=>goPage(page-1);

const pageInfo=document.createElement("span");
pageInfo.textContent="Page "+data.page+" of "+data.totalPages;

const next=document.createElement("button");
next.textContent="Next";
next.disabled=page>=data.totalPages;
next.onclick=()=>goPage(page+1);

pagination.append(prev,pageInfo,next);

}catch(e){
info.textContent="";
box.innerHTML="<p>Goobrow could not connect to the search server.</p>";
}
}

function goPage(p){
location.href="results.html?q="+encodeURIComponent(query)+"&page="+p;
}

input.addEventListener("keydown",e=>{if(e.key==="Enter")search(e)});
loadResults();
</script>

<script>
const oldInput=document.getElementById("searchInput");
const oldResults=document.getElementById("results");
const p=new URLSearchParams(location.search);
const q=p.get("q")||"";
const mode=p.get("mode")||"web";

if(oldInput)oldInput.value=q;

function escapeHtml(x){
 const d=document.createElement("div");
 d.textContent=String(x||"");
 return d.innerHTML;
}

async function goobrowImages(){
 try{
  const response=await fetch("http://localhost:3001/api/images?q="+encodeURIComponent(q));
  const data=await response.json();
  oldResults.innerHTML="";
  if(!data.images||!data.images.length){
   oldResults.innerHTML="<p>No images found for <b>"+escapeHtml(q)+"</b>.</p>";
   return;
  }
  const grid=document.createElement("div");
  grid.className="images";
  grid.style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px;width:100%";
  data.images.forEach(im=>{
   const card=document.createElement("div");
   card.style="border:1px solid #eee;border-radius:10px;overflow:hidden;background:#fff";
   card.innerHTML='<a href="'+escapeHtml(im.source)+'" target="_blank"><img src="'+escapeHtml(im.image)+'" loading="lazy" style="width:100%;height:180px;object-fit:cover;display:block"></a><div style="padding:8px;font-size:13px">'+escapeHtml(im.title)+'</div>';
   grid.appendChild(card);
  });
  oldResults.appendChild(grid);
 }catch(e){
  oldResults.innerHTML="<p>Goobrow image search is unavailable.</p>";
 }
}

async function goobrowNews(){
 try{
  const response=await fetch("http://localhost:3001/api/news?q="+encodeURIComponent(q));
  const data=await response.json();
  oldResults.innerHTML="";
  if(!data.results||!data.results.length){
   oldResults.innerHTML="<p>No news found.</p>";
   return;
  }
  data.results.forEach(n=>{
   const item=document.createElement("div");
   item.style="display:flex;gap:15px;margin-bottom:25px;padding-bottom:20px;border-bottom:1px solid #eee";
   item.innerHTML='<div style="width:120px;height:80px;background:#eee;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px">📰</div><div><h2 style="margin:0 0 8px;font-size:19px"><a href="'+escapeHtml(n.url)+'" target="_blank" style="color:#1a0dab;text-decoration:none">'+escapeHtml(n.title)+'</a></h2><small>'+escapeHtml(n.date)+'</small></div>';
   oldResults.appendChild(item);
  });
 }catch(e){
  oldResults.innerHTML="<p>Goobrow news is unavailable.</p>";
 }
}

if(q&&mode==="images")goobrowImages();
if(q&&mode==="news")goobrowNews();
</script>
</body>
</html>
